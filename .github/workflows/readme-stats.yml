# Save this file in your abbasshafi/abbasshafi repo at:
#   .github/workflows/readme-stats.yml
#
# It builds your GitHub stats cards once a day and saves them as images
# inside the repo (profile/stats.svg and profile/top-langs.svg), so your
# README no longer depends on the overloaded public stats server.

name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC (05:00 in Pakistan)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
